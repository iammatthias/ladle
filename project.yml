name: Ladle
options:
  bundleIdPrefix: app.ladle
  deploymentTarget:
    # The newest installed SDK is iOS 27.1 (Xcode 27.1). Bump to 27.2 once Xcode ships its SDK.
    iOS: "27.1"
  createIntermediateGroups: true
packages:
  ApronKit:
    path: Packages/ApronKit
configFiles:
  Debug: Config/Domains.xcconfig
  Release: Config/Domains.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: MP92RCAPRG
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Ladle:
    type: application
    platform: iOS
    sources:
      - path: Ladle
    dependencies:
      - package: ApronKit
    info:
      path: Config/Ladle-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # §A.4 links from other apps: apron:?server=…&room=…
        CFBundleURLTypes:
          - CFBundleURLName: app.ladle.ios.apron
            CFBundleURLSchemes: [apron]
        # Only standard TLS (HTTPS and WSS), which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ladle.ios
        PRODUCT_NAME: Ladle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ladle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Ladle uses the camera to take photos and videos you attach to messages.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Ladle uses the microphone to record voice notes you attach to messages, and to record sound with videos you take.
        ENABLE_PREVIEWS: YES
  # Debug-only design-review renderer: the app's views as a Mac Catalyst app that writes PNGs of
  # the PreviewFixtures screens and quits. iOS 27.0 because this Mac's iOS support version is
  # 27.0; ad-hoc signed so it runs without a provisioning profile. See AGENTS.md, "Design review".
  LadleShots:
    type: application
    platform: iOS
    sources:
      - path: Ladle
        excludes:
          - App/LadleApp.swift
      - path: LadleShots
    dependencies:
      - package: ApronKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ladle.ios.shots
        PRODUCT_NAME: LadleShots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
  # Hermetic: no network, no server. The protocol and server integration tests live in
  # Packages/ApronKit (swift test).
  LadleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LadleTests
    dependencies:
      - target: Ladle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ladle.app/Ladle"
schemes:
  Ladle:
    build:
      targets:
        Ladle: all
        LadleTests: [test]
    test:
      targets:
        - LadleTests
  LadleShots:
    build:
      targets:
        LadleShots: all
    run:
      config: Debug
