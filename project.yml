name: Apron
options:
  bundleIdPrefix: com.iammatthias
  deploymentTarget:
    # The newest installed SDK is iOS 27.1 (Xcode 27.1). Bump to 27.2 once Xcode ships its SDK.
    iOS: "27.1"
  createIntermediateGroups: true
packages:
  ApronKit:
    path: Packages/ApronKit
configFiles:
  Debug: Config/Domains.xcconfig
  Release: Config/Domains.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: MP92RCAPRG
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Apron:
    type: application
    platform: iOS
    sources:
      - path: Apron
    dependencies:
      - package: ApronKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iammatthias.apron
        PRODUCT_NAME: Apron
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Apron
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Apron uses the camera to scan a sign-in QR code.
        ENABLE_PREVIEWS: YES
  # Hermetic: no network, no server. The protocol and server integration tests live in
  # Packages/ApronKit (swift test).
  ApronTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ApronTests
    dependencies:
      - target: Apron
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Apron.app/Apron"
schemes:
  Apron:
    build:
      targets:
        Apron: all
        ApronTests: [test]
    test:
      targets:
        - ApronTests
